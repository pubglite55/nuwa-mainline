name: build-bootefi

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-bootefi.yml'
      - 'tools/init'

permissions:
  contents: read

jobs:
  bootefi:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            cpio kmod device-tree-compiler python3 zstd busybox-static

      - name: 克隆社区内核（7.0 + nuwa 补丁）
        run: |
          git clone --depth 1 --branch 7.0 https://github.com/alfaonyt/nuwa-mainline.git kc
          cd kc && git log --oneline -1

      - name: 生成 initramfs 根目录
        run: |
          set -e
          ROOT="$GITHUB_WORKSPACE/ir-root"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"/bin "$ROOT"/dev "$ROOT"/proc "$ROOT"/sys "$ROOT"/tmp "$ROOT"/lib/modules
          cp /bin/busybox "$ROOT/bin/busybox"
          cp tools/init "$ROOT/init"
          chmod 755 "$ROOT/init" "$ROOT/bin/busybox"
          file "$ROOT/bin/busybox"

      - name: 配置自包含内核
        run: |
          set -e
          cd kc
          make ARCH=arm64 defconfig
          ./scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/sm8550.config
          ./scripts/config --set-str INITRAMFS_SOURCE "$GITHUB_WORKSPACE/ir-root"
          ./scripts/config --set-str CMDLINE "console=tty0 console=ttyAMA0 ignore_loglevel loglevel=7 keep_bootcon clk_ignore_unused pd_ignore_unused fbcon=rotate:1"
          ./scripts/config --disable CMDLINE_FROM_BOOTLOADER
          ./scripts/config --enable CMDLINE_FORCE
          ./scripts/config --enable EFI_STUB
          ./scripts/config --enable FB_EFI
          ./scripts/config --enable DRM_SIMPLEDRM
          ./scripts/config --enable USB_GADGET
          ./scripts/config --enable USB_DWC3
          ./scripts/config --enable USB_DWC3_QCOM
          ./scripts/config --enable USB_CONFIGFS
          ./scripts/config --enable USB_CONFIGFS_NCM
          ./scripts/config --enable USB_F_NCM
          ./scripts/config --enable USB_ROLE_SWITCH
          ./scripts/config --enable PHY_QCOM_SNPS_FEMTO_V2
          # 启动/显示/输入/存储依赖链整链内建（经验库：=m 且无模块目录会静默缺失）
          ./scripts/config --enable QCOM_GPI_DMA
          ./scripts/config --enable SPI_QCOM_GENI
          ./scripts/config --enable SPI_QCOM_QSPI
          ./scripts/config --enable POWER_RESET_QCOM_PON
          ./scripts/config --enable QCOM_PD_MAPPER
          ./scripts/config --enable QRTR
          ./scripts/config --enable QRTR_SMD
          ./scripts/config --enable RTC_DRV_PM8XXX
          ./scripts/config --enable NVMEM_REBOOT_MODE
          ./scripts/config --enable NVMEM_SPMI_SDAM
          ./scripts/config --enable BATTERY_QCOM_BATTMGR
          ./scripts/config --enable QCOM_CPUCP_MBOX
          ./scripts/config --enable OVERLAY_FS
          ./scripts/config --enable PHY_QCOM_QMP_PCIE
          ./scripts/config --enable RFKILL
          # 外设驱动也内建：避免 make modules 编译数千个模块（构建 1 小时+）
          ./scripts/config --enable DRM_PANEL_SAMSUNG_AMB673CP01_M2
          ./scripts/config --enable TOUCHSCREEN_ST_FTS_V521_SPI
          ./scripts/config --enable SND_SOC_CS35L41_I2C
          ./scripts/config --enable SND_SOC_CS35L41
          ./scripts/config --enable SND_SOC_CS35L41_LIB
          ./scripts/config --enable CLK_QCOM_DISPCC_SM8550
          ./scripts/config --enable QCOM_CLK_RPMH
          ./scripts/config --enable PINCTRL_SM8550
          ./scripts/config --enable PINCTRL_SM8550_LPASS_LPI
          ./scripts/config --enable QCOM_SMEM
          ./scripts/config --enable QCOM_SMD_RPM
          ./scripts/config --enable QCOM_RPMH
          ./scripts/config --enable ARM_SMMU
          ./scripts/config --enable QCOM_LLCC
          ./scripts/config --enable INPUT_GPIO_KEYS
          ./scripts/config --enable KEYBOARD_GPIO
          ./scripts/config --enable INPUT_KEYBOARD
          ./scripts/config --enable SCSI_UFS_QCOM
          make ARCH=arm64 olddefconfig
          grep -E "CONFIG_INITRAMFS_SOURCE|CONFIG_CMDLINE=|CONFIG_USB_DWC3_QCOM|CONFIG_USB_F_NCM" .config

      - name: 编译内核（全部内建，无模块）
        run: |
          cd kc
          make ARCH=arm64 -j"$(nproc)" Image
          ls -l arch/arm64/boot/Image
          cp arch/arm64/boot/Image "$GITHUB_WORKSPACE/BOOTAA64.EFI"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: bootefi
          path: |
            BOOTAA64.EFI
          if-no-files-found: error

